name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Exercise moving channel aliases weekly, away from the top-of-hour load spike.
    - cron: "37 8 * * 2"

jobs:
  e2e:
    name: Firefox ${{ matrix.firefox.channel }} (${{ matrix.firefox.suite }})
    runs-on: ubuntu-24.04
    # Each Release shard normally takes well under half of this. Keep enough
    # headroom for bounded setup retries while preventing a wedged runner from
    # consuming the old full-suite timeout.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        firefox:
          - channel: esr
            version: latest-esr
            suite: compatibility
            command: npm run test:e2e:compat
            shard: 1/1
          - channel: release
            version: latest
            suite: full 1/2
            command: npm run test:e2e
            shard: 1/2
          - channel: release
            version: latest
            suite: full 2/2
            command: npm run test:e2e
            shard: 2/2
          - channel: beta
            version: latest-beta
            suite: compatibility
            command: npm run test:e2e:compat
            shard: 1/1
          - channel: nightly
            version: latest-nightly
            suite: compatibility
            command: npm run test:e2e:compat
            shard: 1/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Firefox ${{ matrix.firefox.channel }}
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: ${{ matrix.firefox.version }}

      - name: Show Firefox version
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: '"$FIREFOX_BINARY" --version'

      - name: Run Node e2e tests
        id: tests
        continue-on-error: true
        env:
          E2E_CONCURRENCY: 1
          E2E_SHARD: ${{ matrix.firefox.shard }}
          E2E_FIREFOX_CHANNEL: ${{ matrix.firefox.channel }}
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          FIREFOX_LLDB_ALLOW_UNSUPPORTED: 1
          FIREFOX_LLDB_LOG_DIR: /tmp/firefox-logs
        run: |
          mkdir -p "$FIREFOX_LLDB_LOG_DIR"
          ${{ matrix.firefox.command }}

      # Keep successful runs too: a recovered setup attempt is still evidence
      # of a reliability failure. Each matrix job and rerun owns a distinct zip.
      - name: Retain debugger and Firefox transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firefox-logs-${{ matrix.firefox.channel }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: /tmp/firefox-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job when the suite failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  report-scheduled-failure:
    name: Report scheduled compatibility result
    if: always() && github.event_name == 'schedule'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MATRIX_RESULT: ${{ needs.e2e.result }}
      ISSUE_TITLE: "Automated Firefox compatibility check is failing"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: File, update, or close the compatibility issue
        run: |
          summary="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("Firefox ")) | "- \(.name): **\(.conclusion)**"')"
          issue_number="$(gh issue list --state open --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)"

          if [[ "$MATRIX_RESULT" != "success" ]]; then
            body_file="$RUNNER_TEMP/firefox-compatibility-issue.md"
            {
              echo "The weekly release-channel compatibility matrix failed."
              echo
              echo "$summary"
              echo
              echo "Run: $RUN_URL"
              echo
              echo "This can indicate an RDP compatibility regression or an e2e reliability failure."
            } > "$body_file"

            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --body-file "$body_file"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$body_file"
            fi
            exit 1
          fi

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" \
              --body "The Firefox compatibility matrix is green again: $RUN_URL"
            gh issue close "$issue_number" --reason completed
          fi
