<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Wasm Modules</title>
</head>
<body>
  <script src="math.js"></script>
  <script>
    let factorialA;
    let factorialB;

    Promise.all([
      MathModule({ locateFile: path => `${path}?component=a` }),
      MathModule({ locateFile: path => `${path}?component=b` }),
    ]).then(([a, b]) => {
      factorialA = a.cwrap('compute_factorial', 'number', ['number']);
      factorialB = b.cwrap('compute_factorial', 'number', ['number']);
    });

    function runA() {
      return factorialA(10);
    }

    function runB() {
      return factorialB(8);
    }
  </script>
</body>
</html>
