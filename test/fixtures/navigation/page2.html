<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Wasm Debugger Test — page 2</title>
</head>
<body>
  <h1>page 2</h1>

  <script src="math.js"></script>
  <script>
    let factorial;

    MathModule().then(mod => {
      factorial = mod.cwrap('compute_factorial', 'number', ['number']);
    });

    function runFactorial() {
      return factorial(10);
    }

    if (new URLSearchParams(location.search).has('dap')) {
      (function poll() {
        if (!factorial) return setTimeout(poll, 20);
        // The first hit lets LLDB consume the module change and rebind the
        // source breakpoint; the second is the user-visible stop.
        runFactorial();
        setTimeout(runFactorial, 1000);
      })();
    }
  </script>
</body>
</html>
